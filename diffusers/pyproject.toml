[project]
name = "diffusers"
version = "0.36.0.dev0"
description = "State-of-the-art diffusion in PyTorch and JAX."
requires-python = ">=3.8.0"

dependencies = [
    # Core dependencies (from setup.py install_requires, updated to installed versions)
    "Pillow>=12.1.1",
    "filelock>=3.25.2",
    "huggingface-hub>=1.8.0",
    "importlib_metadata>=9.0.0",
    "numpy>=2.4.3",
    "regex>=2026.2.28",
    "requests>=2.33.0",
    "safetensors>=0.7.0",

    # Packages installed but missing from setup.py
    "packaging>=25.0",
    "psutil>=7.2.2",
    "PyYAML>=6.0.3",
    "tqdm>=4.67.3",

    # ML/DL dependencies (installed, with updated versions vs setup.py)
    "accelerate>=1.13.0",
    "Jinja2>=3.1.6",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.4.0",

    # Updated from setup.py (was urllib3<=2.0.0, but 2.6.3 is installed)
    "urllib3>=2.6.3",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"src/diffusers/utils/dummy_*.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["diffusers"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
